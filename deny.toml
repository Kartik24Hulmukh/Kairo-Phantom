# =============================================================================
# Kairo-Phantom — cargo-deny configuration (SINGLE source of truth for Rust)
# =============================================================================
# This file is the ONE config for Rust advisory ignores + license policy.
# cargo-deny reads this file via `cargo deny check --config deny.toml`.
#
# We do NOT use standalone `cargo audit` because it reads audit.toml, not
# deny.toml — that would create two sources of truth for advisory ignores.
# cargo-deny's [advisories] section is the single source of truth.
#
# GOVERNANCE:
#   - Only RUSTSEC IDs listed in [advisories] ignore are accepted.
#   - Each ignored advisory MUST have a reason.
#   - Any NEW advisory or any advisory affecting a DIRECT dependency → FAIL.
#   - cargo-audit reports 0 Rust CVEs (PROGRESS.md C2); the ignore list is
#     empty but the structure is in place for when advisories appear.
# =============================================================================

[graph]
# Use the workspace Cargo.lock — no override needed.

[advisories]
# ── Accepted (ignored) advisories ──
# Format: { id = "RUSTSEC-YYYY-NNNN", reason = "..." }
# Currently: 1 accepted Rust advisory (unmaintained, no safe upgrade).
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is unmaintained (not a vulnerability). Used for LAN sync packet serialization and embedding blob storage in MemMachine. No safe upgrade exists (crate ceased development). Replacing with postcard/rmp-serde would break backward compatibility with existing stored embeddings and LAN sync protocol. bincode 1.3.3 is feature-complete for our usage (serialize/deserialize simple structs). Reviewed 2026-06-27." },
    # Transitive DoS in quick-xml via plist (pins ^0.39.2); no upstream fix as of 2026-07-03.
    # Exposure: plist used only in macOS packaging, not on an untrusted-input runtime path.
    # REMOVE when plist adopts quick-xml >= 0.41. Review by 2026-08-03.
    { id = "RUSTSEC-2026-0194", reason = "Quadratic run time checking start tag for duplicate attribute names in quick-xml 0.39.4 (transitive via plist 1.9.0 which pins ^0.39.2). plist is used only in macOS packaging metadata, not on any untrusted-input runtime path. Patched in quick-xml >= 0.41.0 but plist has not adopted it yet. Time-boxed waiver: review by 2026-08-03; remove when plist upgrades." },
    { id = "RUSTSEC-2026-0195", reason = "Unbounded namespace-declaration allocation in NsReader enables memory-exhaustion DoS in quick-xml 0.39.4 (transitive via plist 1.9.0 which pins ^0.39.2). plist is used only in macOS packaging metadata, not on any untrusted-input runtime path. Patched in quick-xml >= 0.41.0 but plist has not adopted it yet. Time-boxed waiver: review by 2026-08-03; remove when plist upgrades." },
    # Invalid pointer dereference in fmt::Pointer impl for Atomic/Shared — transitive via stable_deref_trait.
    # Exposure: only triggered when formatting an invalid pointer (not a normal runtime path).
    # Time-boxed waiver: review by 2026-09-06; remove when upstream fixes.
    { id = "RUSTSEC-2026-0204", reason = "Invalid pointer dereference in fmt::Pointer impl for Atomic and Shared when the underlying pointer is invalid. Transitive dependency (stable_deref_trait). Only triggered when formatting an already-invalid pointer — not on any normal runtime path with trusted input. No safe upgrade available yet. Time-boxed waiver: review by 2026-09-06." },
]

# ── Unfixed advisories: treat as vulnerabilities (not warnings) ──
unmaintained = "workspace"
yanked = "deny"

[licenses]
# ── Allow only permissive / weak copyleft licenses ──
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
# ── Copyleft / restrictive licenses are BLOCKED by default-deny ──
# In cargo-deny 0.19+ (PR #611), the `deny` field was removed and the default
# behavior changed to: any license NOT in the `allow` list above is DENIED.
# This is STRICTER than the old explicit `deny` blocklist — unknown/unlisted
# licenses are now denied (previously they were only warned).
# The copyleft licenses below (GPL, AGPL, LGPL, SSPL, EUPL, BUSL) are not in
# the `allow` list, so they are blocked by the default-deny mechanism.
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = [
    { name = "openssl", version = "<0.10.55", reason = "Multiple CVEs in old openssl bindings" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []