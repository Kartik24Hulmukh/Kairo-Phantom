<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
</head>
<body>
    <h1>Contact Us</h1>
    <form id="contact_form" action="/contact" method="POST">
        <label for="name">Full Name (required):</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email (required):</label>
        <input type="email" id="email" name="email" required>

        <label for="subject">Subject (required):</label>
        <input type="text" id="subject" name="subject" required>

        <label for="message">Message (required):</label>
        <textarea id="message" name="message" rows="5" cols="40" required></textarea>

        <label for="department">Department:</label>
        <select id="department" name="department">
            <option value="">-- Select --</option>
            <option value="support">Support</option>
            <option value="sales">Sales</option>
            <option value="billing">Billing</option>
        </select>

        <label>
            <input type="checkbox" name="urgent" value="yes" id="urgent">
            Mark as urgent
        </label>

        <button type="submit" id="submit_btn">Send Message</button>
    </form>
</body>
</html>
