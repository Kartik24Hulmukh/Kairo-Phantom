name: legal-v3-gates

on:
  push:
    branches: [master, "legal-v3/**"]
  pull_request:
    branches: [master]

jobs:
  legal-v3-tests:
    name: Legal-v3 unit + adversarial tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install cryptography python-docx pytest
      - name: Run legal-v3 e2e + adversarial tests
        run: |
          PYTHONPATH=. python3 -m pytest tests/test_legal_v3_e2e.py tests/test_legal_v3_adversarial.py -v
      - name: Run negative conformance vectors
        run: |
          PYTHONPATH=. python3 -m pytest tests/test_legal_v3_negative_conformance.py -v

  legal-v3-hardening-tests:
    name: Legal-v3 trust policy + DSSE + crash tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install cryptography python-docx pytest
      - name: Run trust policy + DSSE + crash tests
        run: |
          PYTHONPATH=. python3 -m pytest tests/test_legal_v3_trust_policy.py tests/test_legal_v3_dsse_envelope.py tests/test_legal_v3_crash_during_publish.py -v

  legal-v3-release-build:
    name: Release builder + surface audit
    runs-on: ubuntu-latest
    needs: legal-v3-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install cryptography python-docx
      - name: Build legal-v3 release
        run: |
          PYTHONPATH=. python3 scripts/build_legal_v3_release.py target/legal-v3-release
      - name: Verify surface audit passed
        run: |
          python3 -c "
          import json, sys
          audit = json.load(open('target/legal-v3-release/SURFACE_AUDIT.json'))
          if audit['status'] != 'PASS':
              print(f'SURFACE AUDIT FAILED: {audit[\"finding_count\"]} findings', file=sys.stderr)
              for f in audit['findings']:
                  print(f'  {f[\"file\"]}: {f[\"type\"]} — {f[\"pattern\"]}', file=sys.stderr)
              sys.exit(1)
          print(f'SURFACE AUDIT: PASS (0 findings)')
          "

  legal-v3-cli-e2e:
    name: CLI propose/approve/execute/verify e2e
    runs-on: ubuntu-latest
    needs: [legal-v3-tests, legal-v3-hardening-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install cryptography python-docx
      - name: Run CLI e2e
        run: |
          export PYTHONPATH=.
          WORK=$(mktemp -d)
          cd "$WORK"
          python3 ${{ github.workspace }}/tools/kairo_legal_v3.py keygen producer producer.json
          python3 ${{ github.workspace }}/tools/kairo_legal_v3.py keygen approver approver.json
          python3 ${{ github.workspace }}/tools/kairo_legal_v3.py keygen observer observer.json
          cp ${{ github.workspace }}/fixtures/demo/sample_nda.docx nda.docx
          cp ${{ github.workspace }}/fixtures/demo/nda_playbook.json playbook.json
          python3 ${{ github.workspace }}/tools/kairo_legal_v3.py propose . nda.docx playbook.json out.docx producer.json proposal.json
          python3 ${{ github.workspace }}/tools/kairo_legal_v3.py approve proposal.json approver.json approval.json
          python3 ${{ github.workspace }}/tools/kairo_legal_v3.py execute . proposal.json approval.json producer.json approver.json observer.json bundle
          python3 ${{ github.workspace }}/tools/kairo_legal_v3.py verify bundle > verify_result.json
          python3 -c "
          import json, sys
          r = json.load(open('verify_result.json'))
          assert r['ok'] is True, f'verify failed: {r}'
          assert r['integrity'] == 'pass'
          assert r['domain'] == 'requires_human_review'
          print('CLI e2e: PASS')
          "

  legal-v3-soak:
    name: 100-run synthetic soak
    runs-on: ubuntu-latest
    needs: [legal-v3-tests, legal-v3-hardening-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install cryptography python-docx
      - name: Run 100-iteration soak
        run: |
          PYTHONPATH=. python3 scripts/legal_v3_soak.py --runs 100

  claim-language-guard:
    name: Forbidden claim language guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for forbidden claims in legal-v3 surface
        run: |
          python3 -c "
          import os, re, sys
          FORBIDDEN = [
              'production-ready', 'injection-safe', 'zero sockets',
              'whole-machine air gap', 'every action signed',
              'certified', 'compliant', 'privilege-safe',
              '100% accurate legal automation', 'uncopyable', '1000x',
              'unicorn-guaranteed',
          ]
          # Files that define the forbidden list or negation context by design
          EXEMPT_FILES = {
              'scripts/build_legal_v3_release.py',
              'CLAIMS.md',
              '.github/workflows/legal-v3-gates.yml',
          }
          CHECK_DIRS = ['kairo/legal_v3', 'kairo/oracles', 'kairo/security',
                        'tools/kairo_legal_v3.py',
                        'docs/LEGAL_V3_IMPLEMENTATION_STATUS.md', 'docs/LEGAL_V3_RUNBOOK.md',
                        'docs/OPEN_BLOCKERS.md', 'STATUS.md', 'SECURITY.md', 'README.md']
          findings = []
          for d in CHECK_DIRS:
              if os.path.isfile(d):
                  files = [d]
              elif os.path.isdir(d):
                  files = []
                  for root, _, fnames in os.walk(d):
                      for fn in fnames:
                          if fn.endswith(('.py', '.md', '.json', '.txt', '.yml', '.yaml')):
                              files.append(os.path.join(root, fn))
              else:
                  continue
              for fpath in files:
                  if fpath in EXEMPT_FILES:
                      continue
                  try:
                      content = open(fpath, encoding='utf-8', errors='ignore').read()
                  except Exception:
                      continue
                  for claim in FORBIDDEN:
                      # Check if the claim appears in an affirmative context
                      # (not negated by 'not ' or 'NOT ' or 'never ')
                      pattern = r'(?<!not )(?<!NOT )(?<!never )(?<!Never )' + re.escape(claim)
                      for m in re.finditer(pattern, content, re.IGNORECASE):
                          # Get surrounding context (20 chars before)
                          start = max(0, m.start() - 20)
                          context = content[start:m.start()]
                          if 'not ' in context.lower() or 'never ' in context.lower():
                              continue
                          findings.append(f'{fpath}: forbidden claim \"{claim}\"')
          if findings:
              for f in findings:
                  print(f, file=sys.stderr)
              sys.exit(1)
          print('Claim language guard: PASS')
          "

  domain-scope-guard:
    name: Twelve-domain scope guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no legacy domain modifications in legal-v3 files
        run: |
          python3 -c "
          import os, sys
          LEGAL_V3_PATHS = ['kairo/legal_v3', 'kairo/oracles/legal_redline_pipeline.py',
                            'kairo/oracles/docx_tracked_changes.py',
                            'kairo/oracles/ed25519_audit_log.py',
                            'kairo/oracles/zero_egress_report.py',
                            'kairo/security/injection_guard.py',
                            'tools/kairo_legal_v3.py',
                            'scripts/build_legal_v3_release.py',
                            'tests/test_legal_v3_e2e.py',
                            'tests/test_legal_v3_adversarial.py',
                            'tests/test_legal_v3_negative_conformance.py',
                            'tests/test_legal_v3_trust_policy.py',
                            'tests/test_legal_v3_dsse_envelope.py',
                            'tests/test_legal_v3_crash_during_publish.py']
          LEGACY_IMPORTS = ['kairo.domains', 'kairo.cua', 'kairo.sync',
                            'kairo.context', 'kairo.docintel', 'kairo.graph',
                            'kairo.observability', 'kairo.core']
          findings = []
          for p in LEGAL_V3_PATHS:
              if os.path.isfile(p):
                  files = [p]
              elif os.path.isdir(p):
                  files = []
                  for root, _, fnames in os.walk(p):
                      for fn in fnames:
                          if fn.endswith('.py'):
                              files.append(os.path.join(root, fn))
              else:
                  continue
              for fpath in files:
                  try:
                      content = open(fpath, encoding='utf-8', errors='ignore').read()
                  except Exception:
                      continue
                  for imp in LEGACY_IMPORTS:
                      if imp in content:
                          findings.append(f'{fpath}: imports legacy domain \"{imp}\"')
          if findings:
              for f in findings:
                  print(f, file=sys.stderr)
              sys.exit(1)
          print('Domain scope guard: PASS')
          "
