# Root Test Suite — runs the FULL root tests/ suite (~887 tests).
#
# Why this workflow exists:
# - No other workflow runs the full root tests/ suite; ci.yml and verify.yml
#   run kairo-sidecar/tests, and cross-platform.yml runs a 10-file subset.
# - Running all ~60 root test files in a single pytest process accumulates
#   memory (test_resource_bounds.py deliberately allocates) and can OOM-kill
#   the run (observed: exit 137 in a 4 GB sandbox). Sharding the files across
#   a matrix bounds per-process memory; pytest-xdist (--dist loadfile) inside
#   each shard bounds it further via worker processes.
# - The e2e shard requires REAL semantic embeddings: model2vec potion-base-8M
#   is VENDORED under kairo-sidecar/assets/models/potion-base-8M/ (no network,
#   no HuggingFace / Xet CAS). KAIRO_REQUIRE_SEMANTIC=1 turns any silent
#   hash-embedding fallback into a hard failure (anti-fake-green).

name: Root Test Suite (full, sharded)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  KAIRO_OFFLINE: "1"
  KAIRO_FORCE_CPU: "1"
  # Offline-first: vendored model under kairo-sidecar/assets/models/potion-base-8M/
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  root-tests:
    name: Root tests shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            kairo-sidecar/requirements.txt
            requirements-test.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r kairo-sidecar/requirements.txt
          pip install -r requirements-test.txt
          pip install pytest pytest-asyncio pytest-xdist pytest-timeout anyio

      - name: Verify vendored model2vec potion-base-8M (offline, no download)
        run: |
          test -f kairo-sidecar/assets/models/potion-base-8M/model.safetensors
          test -f kairo-sidecar/assets/models/potion-base-8M/config.json
          test -f kairo-sidecar/assets/models/potion-base-8M/tokenizer.json
          # Refuse LFS pointer files (must be real binaries in git)
          if head -c 50 kairo-sidecar/assets/models/potion-base-8M/model.safetensors | grep -q 'git-lfs'; then
            echo "FATAL: model.safetensors is a Git LFS pointer, not a real binary" >&2
            exit 1
          fi
          python -c "
          import os
          os.environ['HF_HUB_OFFLINE']='1'
          os.environ['TRANSFORMERS_OFFLINE']='1'
          import sys
          sys.path.insert(0, 'kairo-sidecar')
          from sidecar.model_paths import load_potion_base_8m_static_model, resolve_potion_base_8m_path
          p = resolve_potion_base_8m_path()
          m = load_potion_base_8m_static_model()
          emb = m.encode(['offline smoke'])
          assert emb.shape[-1] == 256, emb.shape
          print('vendored model OK at', p, 'dim', emb.shape)
          "

      - name: Compute shard file list (deterministic round-robin by file)
        id: shard
        run: |
          FILES=$(ls tests/*.py | sort | awk -v s="${{ matrix.shard }}" 'NR % 4 == (s - 1) % 4' | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "Shard is empty — file layout changed; fix the sharding." >&2
            exit 1
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Shard ${{ matrix.shard }} files: $FILES"

      - name: Run shard (xdist, loud semantic fallback, fail-fast timeout)
        env:
          KAIRO_REQUIRE_SEMANTIC: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONPATH: kairo-sidecar
        run: |
          python -m pytest ${{ steps.shard.outputs.files }} \
            -n 2 --dist loadfile \
            --timeout=120 --timeout-method=thread \
            --tb=short \
            -p no:cacheprovider
    timeout-minutes: 30

  root-tests-e2e:
    name: Root e2e (real semantic embeddings, no fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            kairo-sidecar/requirements.txt
            requirements-test.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r kairo-sidecar/requirements.txt
          pip install -r requirements-test.txt
          pip install pytest pytest-asyncio pytest-timeout anyio

      - name: Verify vendored model2vec potion-base-8M (offline, no download)
        run: |
          test -f kairo-sidecar/assets/models/potion-base-8M/model.safetensors
          test -f kairo-sidecar/assets/models/potion-base-8M/config.json
          test -f kairo-sidecar/assets/models/potion-base-8M/tokenizer.json
          if head -c 50 kairo-sidecar/assets/models/potion-base-8M/model.safetensors | grep -q 'git-lfs'; then
            echo "FATAL: model.safetensors is a Git LFS pointer, not a real binary" >&2
            exit 1
          fi
          python -c "
          import os
          os.environ['HF_HUB_OFFLINE']='1'
          os.environ['TRANSFORMERS_OFFLINE']='1'
          import sys
          sys.path.insert(0, 'kairo-sidecar')
          from sidecar.model_paths import load_potion_base_8m_static_model, resolve_potion_base_8m_path
          p = resolve_potion_base_8m_path()
          m = load_potion_base_8m_static_model()
          emb = m.encode(['offline smoke'])
          assert emb.shape[-1] == 256, emb.shape
          print('vendored model OK at', p, 'dim', emb.shape)
          "

      - name: Run e2e suite (KAIRO_REQUIRE_SEMANTIC + vendored offline model)
        env:
          KAIRO_REQUIRE_SEMANTIC: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONPATH: kairo-sidecar
        run: |
          python -m pytest tests/e2e \
            --timeout=120 --timeout-method=thread \
            --tb=short \
            -p no:cacheprovider
    timeout-minutes: 30
